<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <radialGradient id="splashCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#caf0f8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#00b4d8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90e0ef"/>
      <stop offset="50%" stop-color="#0096c7"/>
      <stop offset="100%" stop-color="#03045e"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="300" cy="250" r="220" fill="url(#splashCenter)"/>
  <ellipse cx="300" cy="380" rx="240" ry="40" fill="none" stroke="#48cae4" stroke-width="2" opacity="0.6"/>
  <ellipse cx="300" cy="380" rx="180" ry="28" fill="none" stroke="#0096c7" stroke-width="2.5" opacity="0.7"/>
  <ellipse cx="300" cy="380" rx="110" ry="16" fill="none" stroke="#ade8f4" stroke-width="3" opacity="0.85"/>
  <ellipse cx="300" cy="380" rx="40" ry="6" fill="#caf0f8" opacity="0.9"/>

  <path d="M220,360 Q180,310 150,220 Q170,250 205,320 Z" fill="url(#waveGrad)" opacity="0.8"/>
  <circle cx="145" cy="205" r="8" fill="#48cae4" filter="url(#softGlow)"/>
  <circle cx="130" cy="170" r="5" fill="#caf0f8"/>
  <circle cx="180" cy="150" r="6" fill="#00b4d8"/>

  <path d="M380,360 Q420,310 450,230 Q430,260 395,330 Z" fill="url(#waveGrad)" opacity="0.8"/>
  <circle cx="455" cy="215" r="9" fill="#48cae4" filter="url(#softGlow)"/>
  <circle cx="475" cy="180" r="5.5" fill="#caf0f8"/>
  <circle cx="420" cy="140" r="7" fill="#00b4d8"/>

  <g transform="translate(300, 190)">
    <circle cx="0" cy="0" r="32" fill="#ffffff" opacity="0.95" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="28" fill="url(#waveGrad)" opacity="0.3"/>
    <ellipse cx="-8" cy="-10" rx="10" ry="6" fill="#ffffff" opacity="0.9"/>
  </g>

  <circle cx="310" cy="90" r="14" fill="#e0f2fe" opacity="0.9"/>
  <circle cx="306" cy="86" r="4" fill="#ffffff"/>
  <circle cx="280" cy="40" r="8" fill="#caf0f8" opacity="0.85"/>
</svg>
